site_name: NMTafe Career Taster — Robotics & 3D Printing
site_url: https://taster.netlify.app/
site_description: A one-day STEAM taster — design a name tag, program a robot arm, and drive a Maqueen robot at NMTafe Joondalup
repo_url: https://github.com/your-username/taster-site
repo_name: taster-site
edit_uri: ""

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Nunito
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - content.tooltips
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo.png
  favicon: assets/favicon.png

nav:
  - "🏠 Today's Plan": index.md
  - "🖨️ 3D Printing":
    - "What is 3D Printing?": 3d-printing/index.md
    - "Step 1 — Design in TinkerCad": 3d-printing/tinkercad.md
    - "Step 2 — Export your file": 3d-printing/export.md
    - "Behind the scenes — Slicing": 3d-printing/slicing.md
    - "Behind the scenes — Printing": 3d-printing/printing.md
  - "🦾 Robot Arm":
    - "Meet xArm 2.0": xarm/index.md
    - "Lesson — Pick & Place": xarm/lesson.md
    - "Challenge — Stack the Blocks!": xarm/challenge.md
    - "Advanced — Colour Sensor": xarm/advanced.md
  - "🤖 Maqueen Robotics":
    - "Meet Maqueen": robotics/index.md
    - "Challenge 1 — Make it Move": robotics/challenge-1.md
    - "Challenge 2 — Avoid Obstacles": robotics/challenge-2.md
    - "Challenge 3 — Follow a Line": robotics/challenge-3.md
  - "⭐ Free Choice": free-time.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/checklist.js

plugins:
  - search
  - tags

extra:
  social:
    - icon: fontawesome/solid/school
      link: https://www.northmetrotafe.wa.edu.au/
      name: North Metropolitan TAFE
